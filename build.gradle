plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.4.3" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "java"
    apply plugin: "maven-publish"

    group = rootProject.maven_group
    version = rootProject.mod_version + "+" + rootProject.minecraft_version + "+" + project.name

    base {
        archivesName = rootProject.archives_base_name
    }

    repositories {
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        compileOnly group: "com.google.auto.service", name: "auto-service", version: "1.1.0"
        annotationProcessor group: "com.google.auto.service", name: "auto-service", version: "1.1.0"
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.officialMojangMappings()
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:1.19.4+build.2:v2"
        modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api"
        modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }

    java {
        withSourcesJar()
    }
}
